<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;color:#e8dcc8;
    font-family:"Times New Roman",Georgia,serif;-webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;outline:none}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:18px;background:#07060a;z-index:100;transition:opacity 1.2s ease}
  #boot.gone{opacity:0;pointer-events:none}
  #boot h1{font-size:clamp(28px,6vw,64px);letter-spacing:.34em;margin:0;font-weight:400;
    color:#d8c39a;text-shadow:0 0 40px rgba(200,150,70,.35)}
  #boot .sub{letter-spacing:.5em;font-size:11px;color:#6b6255;text-transform:uppercase}
  #bar{width:min(420px,60vw);height:1px;background:#241f1a;position:relative;overflow:hidden}
  #bar i{position:absolute;inset:0 100% 0 0;background:linear-gradient(90deg,#7a5a28,#e0c184);
    transition:right .35s ease}
  #boot .task{font-size:11px;letter-spacing:.22em;color:#5c554a;text-transform:uppercase;height:1em}
  /* title menu: the H3 loop plays full-screen until any key; then it fades
     into the world. Sits above the boot screen, which keeps loading under it. */
  #menu{position:fixed;inset:0;z-index:300;background:#000;transition:opacity 1.4s ease}
  #menu.gone{opacity:0;pointer-events:none}
  #menu video{width:100%;height:100%;object-fit:cover;display:block}
  #menu .presskey{position:absolute;left:0;right:0;bottom:7vh;text-align:center;
    font-size:13px;letter-spacing:.55em;color:#e8dcc8;text-transform:uppercase;
    text-shadow:0 2px 18px rgba(0,0,0,.9);animation:pk 2.2s ease-in-out infinite}
  @keyframes pk{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<div id="boot">
  <div class="sub">対馬のスロップ</div>
  <h1>SLOP OF TSUSHIMA</h1>
  <div id="bar"><i id="barfill"></i></div>
  <div class="task" id="boottask">initialising</div>
</div>
<div id="menu">
  <video id="menuvid" src="assets/menu.mp4" loop playsinline preload="auto"></video>
  <div class="presskey">Press any key</div>
</div>
<script>
(function () {
  var menu = document.getElementById('menu');
  var vid = document.getElementById('menuvid');
  // headless capture: never let the menu block a screenshot
  if (new URLSearchParams(location.search).get('capture')) {
    menu.remove();
    window.__MENU_DISMISSED = true;
    return;
  }
  // try WITH sound first (the H3 loop has its own track); browsers that
  // refuse unmuted autoplay get the muted cut, sound lands on the keypress
  vid.volume = 0.85;
  var pr = vid.play();
  if (pr && pr.catch) pr.catch(function () { vid.muted = true; vid.play().catch(function () {}); });
  window.__MENU_DISMISSED = false;
  var done = false;
  function dismiss() {
    if (done) return;
    done = true;
    window.__MENU_DISMISSED = true;
    window.dispatchEvent(new Event('game:clearkeys'));   // the dismissing key must not stick in the game
    menu.classList.add('gone');
    setTimeout(function () {
      try { vid.pause(); } catch (e) {}
      menu.remove();
    }, 1500);
  }
  window.addEventListener('keydown', dismiss);
  window.addEventListener('pointerdown', dismiss);
})();
</script>
<script type="module" src="/src/main.js"></script>
</body>
